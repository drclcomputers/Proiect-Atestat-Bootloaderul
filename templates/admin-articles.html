{{define "admin-articles"}} {{template "header" .}}

<h1>Administrare articole</h1>
<a class="btn" href="/admin/articles/new">+ Articol nou</a>

<table class="admin-table">
    <thead>
        <tr>
            <th>Titlu</th>
            <th>Data</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {{range .Data}}
        <tr>
            <td data-label="Titlu">
                <a href="/articles/{{.Slug}}">{{.Title}}</a>
            </td>
            <td data-label="Data">{{.PublishedAt.Format "02.01.2006"}}</td>
            <td data-label="Acțiuni" class="actions">
                <a href="/admin/articles/{{.ID}}/edit">Editează</a>
                <form
                    action="/admin/articles/{{.ID}}/delete"
                    method="post"
                    class="inline"
                    onsubmit="return confirm('Ștergi acest articol?');"
                >
                    <button type="submit" class="link-btn danger">
                        Șterge
                    </button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="3">Niciun articol.</td>
        </tr>
        {{end}}
    </tbody>
</table>

<p style="margin-top: 1.5rem">
    <a class="btn" href="/admin">← Înapoi la panou</a>
</p>

{{template "footer" .}} {{end}}
