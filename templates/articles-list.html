{{define "articles-list"}} {{template "header" .}}

<h1>Jurnal de dezvoltare</h1>
<div class="card-grid">
    {{range .Data}}
    <a class="card" href="/articles/{{.Slug}}">
        <h3>{{.Title}}</h3>
        <p>{{.Summary}}</p>
        <span class="meta">{{.PublishedAt.Format "02.01.2006"}}</span>
    </a>
    {{else}}
    <p>Încă nu există articole.</p>
    {{end}}
</div>

{{template "footer" .}} {{end}}
