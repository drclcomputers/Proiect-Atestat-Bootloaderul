{{define "admin-quiz"}} {{template "header" .}}

<h1>Administrare quiz</h1>
<a class="btn" href="/admin/quiz/results">Vezi rezultate quiz</a>

<table class="admin-table">
    <thead>
        <tr>
            <th>Întrebare</th>
            <th>Corect</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {{range .Data}}
        <tr>
            <td data-label="Întrebare">{{.Question}}</td>
            <td data-label="Corect">{{.CorrectOption}}</td>
            <td data-label="Acțiuni" class="actions">
                <form
                    action="/admin/quiz/{{.ID}}/delete"
                    method="post"
                    class="inline"
                    onsubmit="return confirm('Ștergi această întrebare?');"
                >
                    <button type="submit" class="link-btn danger">
                        Șterge
                    </button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="3">Nicio întrebare.</td>
        </tr>
        {{end}}
    </tbody>
</table>

<h2><center>Adaugă întrebare</center></h2>
<form action="/admin/quiz/new" method="post" class="form-box">
    <label>Întrebare <input type="text" name="question" required /></label>
    <label>Opțiunea A <input type="text" name="option_a" required /></label>
    <label>Opțiunea B <input type="text" name="option_b" required /></label>
    <label>Opțiunea C <input type="text" name="option_c" required /></label>
    <label>Opțiunea D <input type="text" name="option_d" required /></label>
    <label class="label-inline">
        Răspuns corect (A/B/C/D)
        <select name="correct_option" required class="select-sm">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
    </label>
    <label
        >Explicație (opțional) <textarea name="explanation" rows="4"></textarea>
    </label>
    <button type="submit" class="btn">Adaugă</button>
</form>

<p style="margin-top: 1.5rem">
    <a class="btn" href="/admin">← Înapoi la panou</a>
</p>

{{template "footer" .}} {{end}}
