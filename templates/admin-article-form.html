{{define "admin-article-form"}} {{template "header" .}}

<h1>{{if .Data.ID}}Editează articol{{else}}Articol nou{{end}}</h1>

<form
    action="{{if .Data.ID}}/admin/articles/{{.Data.ID}}/edit{{else}}/admin/articles/new{{end}}"
    method="post"
    class="form-box"
>
    <label
        >Titlu
        <input type="text" name="title" value="{{.Data.Title}}" required />
    </label>
    <label
        >Rezumat (afișat în liste)
        <textarea name="summary" rows="2" required>{{.Data.Summary}}</textarea>
    </label>
    <label
        >Conținut
        <textarea name="content" rows="12" required>{{.Data.Content}}</textarea>
    </label>

    <div class="form-actions">
        <a class="btn btn-outline" href="/admin/articles">Anulează</a>
        <button type="submit" class="btn">Salvează</button>
    </div>
</form>

{{template "footer" .}} {{end}}
