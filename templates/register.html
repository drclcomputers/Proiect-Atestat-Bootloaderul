{{define "register"}} {{template "header" .}}

<div class="form-box">
    <h1>Cont nou</h1>
    <form action="/register" method="post">
        <label
            >Nume utilizator (min. 3 caractere)
            <input
                type="text"
                name="username"
                required
                autofocus
                minlength="3"
            />
        </label>
        <label
            >Parola (min. 6 caractere)
            <input type="password" name="password" required minlength="6" />
        </label>
        <br />
        <button type="submit" class="btn">Creează cont</button>
    </form>
    <p class="meta">Ai deja cont? <a href="/login">Autentifică-te</a></p>
</div>

{{template "footer" .}} {{end}}
